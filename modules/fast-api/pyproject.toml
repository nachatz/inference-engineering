[project]
name = "fast-api"
version = "0.1.0"
description = "A production-grade FastAPI codebase for serving a model, served by gunicorn."
authors = [{ name = "Nikolas Achatz" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio==4.15.1",
    "asgi-correlation-id==5.0.1",
    "fastapi==0.143.3",
    "gunicorn==26.2.0",
    "msgspec==0.19.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
    "pydantic-settings==2.16.0",
    "sentry-sdk[fastapi]==2.72.0",
    "uvicorn==0.54.0",
    "uvicorn-worker==0.4.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "locust==2.46.7",
    "mdformat==1.0.0",
    "mypy==2.4.0",
    "onnx==1.23.2",
    "polyfactory==3.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.1",
    "types-psutil==7.2.2.20260906",
]
export = [
    "jaxtyping==0.3.11",
    "onnx==1.23.2",
    "onnxscript==0.7.2",
    "torch==2.14.1",
]

[tool.uv]
package = false
default-groups = ["dev", "export"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
